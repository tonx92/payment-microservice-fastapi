services:
  payments:
    build: ./api
    ports:
      - "${API_PORT}:80"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - API_KEY=${API_KEY}
    depends_on: [postgres, rabbitmq]

  consumer:
    build: ./consumer
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - CONSUMER_WEBHOOK_TIMEOUT=${CONSUMER_WEBHOOK_TIMEOUT:-10.0}
      - CONSUMER_WEBHOOK_MAX_RETRIES=${CONSUMER_WEBHOOK_MAX_RETRIES:-3}
      - CONSUMER_WEBHOOK_RETRY_DELAY=${CONSUMER_WEBHOOK_RETRY_DELAY:-1.0}
      - CONSUMER_WORKER_MAX_ATTEMPTS=${CONSUMER_WORKER_MAX_ATTEMPTS:-3}
      - CONSUMER_PUBLISHER_POLL_INTERVAL=${CONSUMER_PUBLISHER_POLL_INTERVAL:-2.0}
      - CONSUMER_PUBLISHER_BATCH_SIZE=${CONSUMER_PUBLISHER_BATCH_SIZE:-50}
    depends_on: [postgres, rabbitmq]

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rmq_data:/var/lib/rabbitmq

volumes:
  pg_data:
  rmq_data:



